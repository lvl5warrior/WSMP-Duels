# WSMP-Duels configuration

honor:
  # Honor awarded to the winner of a real player-vs-player duel.
  win-amount: 20
  # Honor awarded to the loser of a real player-vs-player duel (participation).
  loss-amount: 5

# Note: honor is only ever awarded for player-vs-player matches. Fighting
# bots (added in a later phase) will never grant honor, per the design.
