name: WSMP-Duels
version: '1.0.0'
main: com.warriorssmp.duels.DuelsPlugin
api-version: '26.2'
author: WarriorsSMP
description: 1v1 duels and The Gauntlet, each on a single static map with a queue, with kits, honor, ranks, and betting.
softdepend: [Vault]

commands:
  duels:
    description: Open the main PvP/Gauntlet menu
    usage: /duels [accept|decline|end|ready|leave|shop|queue|party <invite|accept|decline|leave>]
    aliases: [pvp, duel]
  duelsadmin:
    description: Open the map and kit admin panel
    usage: /duelsadmin
    permission: wsmpduels.admin

permissions:
  wsmpduels.admin:
    description: Access to map and kit administration
    default: op
