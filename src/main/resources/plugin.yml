name: WSMP-Duels
version: '1.0.0'
main: com.warriorssmp.duels.DuelsPlugin
api-version: '26.2'
author: WarriorsSMP
description: 1v1 duels and team wars, with kits, honor, ranks, and arena management.
softdepend: [Vault]

commands:
  duels:
    description: Open the main PvP menu
    usage: /duels [accept|decline|end|ready|leave]
    aliases: [pvp, duel]
  duelsadmin:
    description: Open the arena and kit admin panel
    usage: /duelsadmin
    permission: wsmpduels.admin
  wars:
    description: Open the war party and matchmaking menu
    usage: /wars [accept|decline|leave|end]
    aliases: [war]

permissions:
  wsmpduels.admin:
    description: Access to arena and kit administration
    default: op
